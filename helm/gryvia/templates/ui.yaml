{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gryvia-ui
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
    app: gryvia-ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: gryvia-ui
  template:
    metadata:
      labels:
        app: gryvia-ui
    spec:
      serviceAccountName: gryvia-ui
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ui
        image: {{ include "gryvia.image" (dict "root" . "image" .Values.ui.image) | quote }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 8443
          name: https
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-tmp
          mountPath: /tmp
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: tls
        secret:
          secretName: {{ .Values.tls.secretName }}
          defaultMode: 0440
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gryvia-ui
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
    app: gryvia-ui
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    app: gryvia-ui
  ports:
  - port: 443
    targetPort: https
    protocol: TCP
    name: https
    {{- if and (eq .Values.ui.service.type "NodePort") .Values.ui.service.nodePort }}
    nodePort: {{ .Values.ui.service.nodePort }}
    {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gryvia-ui
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
{{- if .Values.ui.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gryvia-ui
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
  {{- with .Values.ui.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ui.ingress.className }}
  ingressClassName: {{ .Values.ui.ingress.className }}
  {{- end }}
  {{- if .Values.ui.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ui.ingress.host | quote }}]
      secretName: {{ .Values.ui.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ui.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gryvia-ui
                port:
                  name: https
{{- end }}
{{- if .Values.ui.gateway.enabled }}
{{- $ns := include "gryvia.namespace" . }}
{{- $gw := default "gryvia" .Values.ui.gateway.gatewayName }}
{{- $gwNs := default $ns .Values.ui.gateway.gatewayNamespace }}
{{- $tls := and .Values.ui.gateway.createGateway .Values.ui.gateway.tlsSecretName }}
{{- if .Values.ui.gateway.createGateway }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gw }}
  namespace: {{ $ns }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.ui.gateway.gatewayClassName | quote }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.ui.gateway.host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if $tls }}
    - name: https
      protocol: HTTPS
      port: {{ .Values.ui.gateway.httpsPort }}
      hostname: {{ .Values.ui.gateway.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.ui.gateway.tlsSecretName | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
{{- if $tls }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gryvia-ui-redirect
  namespace: {{ $ns }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gw }}
      namespace: {{ $gwNs }}
      sectionName: http
  hostnames:
    - {{ .Values.ui.gateway.host | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: {{ .Values.ui.gateway.httpsPort }}
            statusCode: 301
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gryvia-ui
  namespace: {{ $ns }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gw }}
      namespace: {{ $gwNs }}
      {{- if $tls }}
      sectionName: https
      {{- else if .Values.ui.gateway.createGateway }}
      sectionName: http
      {{- end }}
  hostnames:
    - {{ .Values.ui.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gryvia-ui
          port: 443
      timeouts:
        request: {{ .Values.ui.gateway.requestTimeout | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: gryvia-ui
  namespace: {{ $ns }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: gryvia-ui
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: {{ .Values.ui.gateway.backendTLS.caConfigMapName | quote }}
    hostname: {{ default (printf "gryvia-ui.%s.svc" $ns) .Values.ui.gateway.backendTLS.hostname | quote }}
{{- end }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.ui.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gryvia-ui
  namespace: {{ include "gryvia.namespace" . }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: gryvia-ui
{{- end }}
{{- end }}
