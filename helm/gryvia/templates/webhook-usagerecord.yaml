{{- if and .Values.webhook.enabled .Values.quotaOperator.enabled (dig "quotaOperator" "usageRecordWebhook" "enabled" nil .Values.AsMap) }}
{{- /* Serving cert (own CA) for the quota-operator's GryviaUsageRecord webhook, minted once and reused on upgrades. */ -}}
{{- $ns := include "gryvia.namespace" . }}
{{- $ledger := dig "billing" "ledger" "enabled" false .Values.AsMap }}
{{- $svc := include "gryvia.usageWebhookServiceName" . }}
{{- $secretName := include "gryvia.usageWebhookSecretName" . }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $crt := "" }}
{{- $key := "" }}
{{- $ca := "" }}
{{- if and $existing $existing.data (index $existing.data "tls.crt") (index $existing.data "tls.key") (index $existing.data "ca.crt") }}
{{- $crt = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- $ca = index $existing.data "ca.crt" }}
{{- else }}
{{- $dns := list $svc (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.cluster.local" $svc $ns) }}
{{- $cacert := genCA (printf "%s-ca" $svc) 3650 }}
{{- $cert := genSignedCert (printf "%s.%s.svc" $svc $ns) nil $dns 3650 $cacert }}
{{- $ca = b64enc $cacert.Cert }}
{{- $crt = b64enc $cert.Cert }}
{{- $key = b64enc $cert.Key }}
{{- end }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
  ca.crt: {{ $ca }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  namespace: {{ $ns }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
    app.kubernetes.io/component: quota-operator-webhook
spec:
  selector:
    {{- include "gryvia.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: quota-operator
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
      protocol: TCP
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "gryvia.fullname" . }}-usagerecord
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
webhooks:
  - name: vgryviausagerecord.gryvia.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    matchPolicy: Equivalent
    rules:
      - apiGroups: ["gryvia.io"]
        apiVersions: ["v1alpha1"]
        resources: ["gryviausagerecords"]
        operations: {{ if $ledger }}["UPDATE", "DELETE"]{{ else }}["UPDATE"]{{ end }}
        scope: Namespaced
    clientConfig:
      service:
        name: {{ $svc }}
        namespace: {{ $ns }}
        path: /validate-gryvia-io-v1alpha1-gryviausagerecord
        port: 443
      caBundle: {{ $ca }}
{{- if $ledger }}
{{- range $kind, $plural := dict "gryvialedgerentry" "gryvialedgerentries" "gryviainvoice" "gryviainvoices" }}
  - name: v{{ $kind }}.gryvia.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: {{ $.Values.webhook.timeoutSeconds }}
    matchPolicy: Equivalent
    rules:
      - apiGroups: ["gryvia.io"]
        apiVersions: ["v1alpha1"]
        resources: [{{ $plural | quote }}]
        operations: ["UPDATE", "DELETE"]
        scope: Cluster
    clientConfig:
      service:
        name: {{ $svc }}
        namespace: {{ $ns }}
        path: /validate-gryvia-io-v1alpha1-{{ $kind }}
        port: 443
      caBundle: {{ $ca }}
{{- end }}
{{- end }}
{{- end }}
