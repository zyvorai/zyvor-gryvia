{{- if (dig "workspaceProxy" "enabled" false .Values.AsMap) }}
{{- if not (dig "workspaceProxy" "publicURL" "" .Values.AsMap) }}
{{- fail "workspaceProxy.enabled requires workspaceProxy.publicURL (the origin users open, e.g. https://gryvia.example.com)" }}
{{- end }}
{{- if not (dig "workspaceProxy" "existingSecret" "" .Values.AsMap) }}
{{- /* Generated once and kept across upgrades: it derives the Jupyter tokens of running workspaces. */ -}}
{{- $key := "" }}
{{- $existing := lookup "v1" "Secret" (include "gryvia.namespace" .) "gryvia-workspace-proxy" }}
{{- if and $existing $existing.data (index $existing.data "key") }}
{{- $key = index $existing.data "key" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: gryvia-workspace-proxy
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ $key | quote }}
{{- end }}
{{- end }}
