---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gryviamodelregistries.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: GryviaModelRegistry
    listKind: GryviaModelRegistryList
    plural: gryviamodelregistries
    singular: gryviamodelregistry
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelName
      name: Model
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.stage
      name: Stage
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GryviaModelRegistry is the Schema for the gryviamodelregistries
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GryviaModelRegistrySpec defines the desired state of GryviaModelRegistry
            properties:
              artifacts:
                description: Artifacts defines where the model files are stored
                properties:
                  format:
                    description: Format is the model format (pytorch, onnx, tensorrt,
                      safetensors)
                    type: string
                  pvcName:
                    description: PVCName is the PersistentVolumeClaim storing the
                      model
                    type: string
                  s3Path:
                    description: S3Path is the S3 URI (e.g., s3://bucket/path/to/model)
                    type: string
                  sizeBytes:
                    description: SizeBytes is the total size of the model artifacts
                      in bytes
                    format: int64
                    type: integer
                  subPath:
                    description: SubPath is the path within the PVC or S3 bucket
                    type: string
                type: object
              autoServe:
                description: AutoServe enables automatic inference deployment when
                  the model reaches production stage
                type: boolean
              description:
                description: Description is a human-readable description of this model
                  version
                type: string
              metadata:
                additionalProperties:
                  type: string
                description: Metadata holds arbitrary key-value metadata (e.g., framework,
                  metrics)
                type: object
              modelName:
                description: ModelName is the name of the model
                type: string
              promotionPolicy:
                description: |-
                  PromotionPolicy lets the controller move a staging entry to production when its evaluation metric beats
                  every production entry of the same modelName
                properties:
                  direction:
                    description: Direction is maximize (default) or minimize
                    enum:
                    - maximize
                    - minimize
                    type: string
                  metric:
                    description: Metric is the spec.metadata key holding the evaluation
                      result (for example "eval_score")
                    type: string
                  minDelta:
                    description: MinDelta is how much the metric must improve on the
                      best production entry (default "0")
                    type: string
                  threshold:
                    description: Threshold is an absolute bound the metric must reach
                      (at least for maximize, at most for minimize)
                    type: string
                required:
                - metric
                type: object
              rollbackPolicy:
                description: |-
                  RollbackPolicy lets the controller roll a production entry that serves a shared service back to
                  status.previousVersion when its metric crosses a threshold (for example after a scheduled evaluation wrote a
                  new score into spec.metadata)
                properties:
                  direction:
                    description: Direction is maximize (default) or minimize
                    enum:
                    - maximize
                    - minimize
                    type: string
                  metric:
                    description: Metric is the spec.metadata key holding the latest
                      evaluation result
                    type: string
                  threshold:
                    description: Threshold is the bound the metric must stay at or
                      above (maximize) or at or below (minimize)
                    pattern: ^-?[0-9]+(\.[0-9]+)?$
                    type: string
                required:
                - metric
                - threshold
                type: object
              servingConfig:
                description: ServingConfig defines the configuration for auto-serving
                  when stage is production
                properties:
                  args:
                    description: Args are extra arguments of the serving container
                      (for example vLLM's --max-model-len)
                    items:
                      type: string
                    type: array
                  backend:
                    description: Backend is the inference backend to use (triton,
                      vllm, tensorrt-llm, torchserve)
                    type: string
                  canaryWeight:
                    description: CanaryWeight is the share of pods, in percent, a
                      new version gets as canary (default 10)
                    format: int32
                    type: integer
                  gpuCount:
                    description: GPUCount is the number of GPUs per replica
                    format: int32
                    type: integer
                  gpuType:
                    description: GPUType is the preferred GPU type for serving
                    type: string
                  promoteAfterSeconds:
                    description: PromoteAfterSeconds is how long a healthy canary
                      runs before it is promoted (default 300)
                    format: int64
                    type: integer
                  replicas:
                    description: Replicas is the number of serving replicas
                    format: int32
                    type: integer
                  serviceName:
                    description: |-
                      ServiceName shares one GryviaInferenceService between the versions of a model. The first production
                      version creates it; a later one is rolled out as its canary (autoPromote, autoRollback) and, once promoted,
                      becomes its modelRef while the version it replaced is archived. Empty keeps one "<entry>-serving" per entry.
                    type: string
                  servicePort:
                    description: |-
                      ServicePort is the port the serving container listens on and is probed on. Set it when Args move the
                      server off its backend default (vLLM 8000, Triton 8000, TorchServe 8080).
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              source:
                description: Source identifies where this model was produced
                properties:
                  jobRef:
                    description: JobRef is the name of the GryviaAIJob that produced
                      this model
                    type: string
                  tunerRef:
                    description: TunerRef is the name of the GryviaAutoTuner that
                      produced this model
                    type: string
                  workflowRef:
                    description: WorkflowRef is the name of the GryviaWorkflow that
                      produced this model
                    type: string
                type: object
              stage:
                description: Stage is the current promotion stage (dev, staging, production,
                  archived)
                type: string
              version:
                description: Version is the semantic version of this model entry
                type: string
            required:
            - artifacts
            - modelName
            - version
            type: object
          status:
            description: GryviaModelRegistryStatus defines the observed state of GryviaModelRegistry
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deployedAt:
                description: DeployedAt is when the model was deployed for serving
                format: date-time
                type: string
              health:
                description: Health is the health status of the serving deployment
                  (Healthy, Unhealthy, Unknown)
                type: string
              inferenceServiceName:
                description: InferenceServiceName is the name of the GryviaInferenceService
                  created for this model
                type: string
              message:
                description: Message provides additional status information
                type: string
              phase:
                description: Phase is the current phase (Registered, Deploying, Serving,
                  Failed)
                type: string
              previousVersion:
                description: PreviousVersion is the version that was previously in
                  production (for rollback)
                type: string
              promotionDecision:
                description: PromotionDecision is the last promotionPolicy outcome
                  (Promoted, Rejected, Waiting)
                type: string
              registeredAt:
                description: RegisteredAt is when the model was first registered
                format: date-time
                type: string
              servingEndpoint:
                description: ServingEndpoint is the URL of the deployed inference
                  service
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
