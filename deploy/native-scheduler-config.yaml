apiVersion: v1
kind: ConfigMap
metadata:
  name: gryvia-native-scheduler
  namespace: gryvia-system
data:
  policy.yaml: |
    queues:
      - name: research
        guaranteeGPU: 8000
        maxGPU: 16000
        weight: 1
        borrow: true
      - name: production
        guaranteeGPU: 8000
        maxGPU: 32000
        weight: 2
        borrow: true
