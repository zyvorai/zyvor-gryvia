name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to (re)build, e.g. v0.3.0", required: true }
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - id: vars
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          test "${TAG#v}" = "$(cat VERSION)" || { echo "tag $TAG does not match VERSION $(cat VERSION)"; exit 1; }
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - run: python3 -m unittest discover -s tests
      - run: bash scripts/package-release.sh
      - name: release notes from CHANGELOG
        run: awk -v t="## ${{ steps.vars.outputs.tag }}" 'index($0,t)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md; test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: 'release/*.tar.gz' }
      - name: create or update the GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" release/* --clobber
          else gh release create "$TAG" release/* --title "Gryvia $TAG" --notes-file notes.md; fi
  mac:
    needs: release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: import signing material (only if secrets exist)
        env:
          MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          if [ -n "$MACOS_CERTS_P12" ]; then
            KC="$RUNNER_TEMP/build.keychain"; PW="$(uuidgen)"
            security create-keychain -p "$PW" "$KC"; security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p "$PW" "$KC"
            echo "$MACOS_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
            security import "$RUNNER_TEMP/certs.p12" -k "$KC" -P "$MACOS_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC"
            security list-keychains -d user -s "$KC" login.keychain
            if [ -n "$NOTARY_KEY_P8" ]; then
              echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              xcrun notarytool store-credentials gryvia --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$KC"
              echo "NOTARY_PROFILE=gryvia" >> "$GITHUB_ENV"
            fi
          else
            echo "No signing secrets: building ad hoc signed, unsigned, not notarized artifacts."
          fi
      - run: bash scripts/package-mac.sh "$(cat VERSION)"
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: 'release/Gryvia-*' }
      - name: upload to the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ needs.release.outputs.tag }}" release/Gryvia-* --clobber
