name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'web/**', 'brand/**', 'scripts/build-site.sh', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: bash scripts/build-site.sh
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: node scripts/site-check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
