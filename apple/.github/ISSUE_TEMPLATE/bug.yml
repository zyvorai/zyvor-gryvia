name: Bug report
description: Something is wrong or confusing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What you expected and what you saw. Never paste a token." }
    validations: { required: true }
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Dashboard, Native app, Agent, Control plane / API, CLI, Model hub (onboard/bench/eval), Training, Deployments / Playground, Installer / release, Docs]
    validations: { required: true }
  - type: input
    id: platform
    attributes: { label: "Mac model, macOS version", placeholder: "Mac mini M4 Pro, macOS 27.0" }
  - type: input
    id: version
    attributes: { label: "Gryvia version (gryvia.py --version)", placeholder: "0.3.0" }
  - type: textarea
    id: logs
    attributes: { label: Relevant output, description: "`gryvia.py doctor`, job logs, agent-error.log. Remove tokens and private paths.", render: shell }
