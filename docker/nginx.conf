events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    server {
        # HTTPS only. The certificate is minted by the pod's gen-cert init container
        # (self-signed) into /tls; replace it with a trusted one in production.
        listen 8443 ssl;
        server_name _;
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;
        index index.html;

        # SPA routing - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Chats (playground, agents) wait on a model and stream events: longer reads, nothing buffered.
        location ~ ^/api/(llm/chat|agents/[^/]+/chat)$ {
            proxy_pass https://gryvia-api-gateway:8080;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;

            set $chat_auth_header $http_authorization;
            if ($chat_auth_header = '') {
                set $chat_auth_header 'Bearer demo-key-change-me';
            }
            proxy_set_header Authorization $chat_auth_header;
        }

        # Workspaces (Jupyter, VS Code) through the gateway, which checks the workspace cookie. WebSockets and long
        # sessions; the add_header below replaces the dashboard's CSP, which would block the servers' own scripts.
        location /ws/ {
            proxy_pass https://gryvia-api-gateway:8080;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            client_max_body_size 1G;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
        }

        # Proxy API requests to the API gateway
        location /api/ {
            proxy_pass https://gryvia-api-gateway:8080/api/;
            # The gateway serves a self-signed certificate on the cluster network.
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;

            # Forward authorization header (use client header if present, otherwise use default)
            set $auth_header $http_authorization;
            if ($auth_header = '') {
                set $auth_header 'Bearer demo-key-change-me';
            }
            proxy_set_header Authorization $auth_header;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        # X-XSS-Protection is deprecated; CSP provides better protection
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}
