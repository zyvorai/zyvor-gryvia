name: Kind e2e (KAI Scheduler)

# Runs the KAI Scheduler integration (docs/kai-scheduler.md) on a kind cluster without GPUs:
# fake-gpu-operator for one simulated GPU, KAI Scheduler from its own chart with GPU sharing, Gryvia's ai-operator
# with --kai-scheduler, a job placed by KAI in its queue, two half-GPU jobs sharing the GPU, and all-or-nothing gang
# placement of a multi-pod job against a queue's CPU limit. Images are built from the checkout like e2e-kueue.yml.
# Scenarios live in scripts/e2e-kai.sh.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'operators/ai-operator/**'
      - 'operators/quota-operator/**'
      - 'helm/**'
      - 'crds/**'
      - 'scripts/e2e-kai.sh'
      - 'scripts/kind-demo.sh'
      - '.github/workflows/e2e-kai.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kai:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Install Gryvia with locally built images
        run: GRYVIA_LOCAL_IMAGES=1 ./scripts/kind-demo.sh
      - name: Install KAI Scheduler and turn on the integration
        run: ./scripts/e2e-kai.sh install
      - name: A job is placed by KAI in its queue
        run: ./scripts/e2e-kai.sh place
      - name: Two half-GPU jobs share one (fake) GPU
        run: ./scripts/e2e-kai.sh fraction
      - name: A gang larger than the queue never starts partially
        run: ./scripts/e2e-kai.sh gang
      - name: A tenant gets its own KAI queue
        run: ./scripts/e2e-kai.sh tenant
