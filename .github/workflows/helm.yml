name: Helm Charts

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'helm/**'
      - 'crds/**'
      - '.github/ct.yaml'
      - '.github/workflows/helm.yml'
      - 'scripts/tests/chart-reuse-values.test.sh'
      - 'scripts/tests/submission-chart.test.sh'
      - 'scripts/tests/billing-chart.test.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'helm/**'
      - 'crds/**'
      - '.github/ct.yaml'
      - '.github/workflows/helm.yml'
      - 'scripts/tests/chart-reuse-values.test.sh'
      - 'scripts/tests/submission-chart.test.sh'
      - 'scripts/tests/billing-chart.test.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and Test Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v4
        with:
          version: 'v3.14.0'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (lint)
        run: ct lint --config .github/ct.yaml --all

      - name: Intelligence operations use opt-in writes and namespace-local records
        run: bash scripts/tests/intelligence-chart.test.sh
      - name: Submission admission chart modes
        run: bash scripts/tests/submission-chart.test.sh

      - name: Billing ledger is opt-in (flag, webhooks, RBAC and Stripe test-mode env only when enabled)
        run: bash scripts/tests/billing-chart.test.sh

      - name: Kueue chart switches (default render has no Kueue, each switch adds only its own flag and RBAC)
        run: |
          helm dependency build helm/gryvia
          bash scripts/tests/kueue-chart.test.sh

      - name: Head chart renders with the oldest release's values (helm upgrade --reuse-values)
        run: bash scripts/tests/chart-reuse-values.test.sh

      - name: Create kind cluster
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          # Charts require Kubernetes >= 1.30 (kubeVersion in Chart.yaml).
          node_image: kindest/node:v1.31.0

      - name: Run chart-testing (install)
        run: ct install --config .github/ct.yaml --all

  package:
    name: Package Helm Charts
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v4
        with:
          version: 'v3.14.0'

      - name: Package charts
        run: |
          mkdir -p .helm-repo
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
          for chart in helm/*/; do
            # Its Zyntra and Netra dependencies come from sibling checkouts (scripts/sovereign-aios-deps.sh).
            [ "$chart" = helm/sovereign-aios/ ] && continue
            if grep -q '^dependencies:' "$chart/Chart.yaml"; then helm dependency build "$chart"; fi
            helm package "$chart" -d .helm-repo
          done

      # The chart repository is published together with the docs site (see
      # pages.yml), at https://zyvorai.github.io/gryvia/charts.
