name: Build and Test API Gateway

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/api-gateway/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/api-gateway/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gryvia-api-gateway

jobs:
  test:
    name: Test API Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: services/api-gateway
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx black flake8

      - name: Run linter
        working-directory: services/api-gateway
        run: |
          flake8 main.py --max-line-length=120
          flake8 intelligence routers/intelligence.py routers/intelligence_actions.py routers/intelligence_http.py --max-line-length=120
          black --check main.py

      - name: Run tests
        working-directory: services/api-gateway
        run: |
          pytest --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v4
        with:
          files: services/api-gateway/coverage.xml
          flags: api-gateway

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/api-gateway
          file: services/api-gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
