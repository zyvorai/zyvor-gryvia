name: Gryvia Apple verification
on:
  workflow_dispatch:
  push:
    paths: ['apple/**', '.github/workflows/apple-native.yml']
  pull_request:
    paths: ['apple/**', '.github/workflows/apple-native.yml']
defaults:
  run:
    working-directory: apple
permissions:
  contents: read
jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check-headers.py
      - run: python3 -m compileall -q server runtimes scripts
      - run: node --check web/app.js
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: swift test
        working-directory: apple/native
      - run: swift build -c release
        working-directory: apple/native
      - run: bash scripts/mac-smoke.sh
      - run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gryvia-macOS-development
          path: apple/dist/Gryvia-macOS.zip
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
