name: Build and Test Operators

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'operators/**'
      - 'crds/**'
      - '.github/workflows/operators.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'operators/**'
      - 'crds/**'
      - '.github/workflows/operators.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: gryvia

jobs:
  test-operators:
    name: Test Operators
    runs-on: ubuntu-latest
    strategy:
      matrix:
        operator: [gpu-operator, ai-operator, storage-operator, network-operator, quota-operator]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        working-directory: operators/${{ matrix.operator }}
        run: |
          go mod download
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: operators/${{ matrix.operator }}/coverage.out
          flags: ${{ matrix.operator }}

  build-operators:
    name: Build Operator Images
    runs-on: ubuntu-latest
    needs: test-operators
    if: github.event_name == 'push'
    strategy:
      matrix:
        operator: [gpu-operator, ai-operator, storage-operator, network-operator, quota-operator]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.operator }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: operators/${{ matrix.operator }}
          file: operators/${{ matrix.operator }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      # Every operator is its own Go module, so lint runs per module. (golangci-lint v1.57.2 was pointed at
      # `operators/`, which has no go.mod, and could not load go 1.27 modules: the job never ran.)
      - name: gofmt
        run: |
          out=$(gofmt -l operators)
          test -z "$out" || { echo "$out"; echo "::error::gofmt needed"; exit 1; }

      - name: go vet
        run: |
          for d in operators/*/; do
            test -f "$d/go.mod" || continue
            echo "== $d"
            (cd "$d" && go vet ./...)
          done
