apiVersion: apps/v1
kind: Deployment
metadata:
  name: gryvia-ui
  namespace: gryvia-system
  labels:
    app: gryvia-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gryvia-ui
  template:
    metadata:
      labels:
        app: gryvia-ui
    spec:
      serviceAccountName: gryvia-ui
      initContainers:
      - name: gen-cert
        image: alpine/openssl:3.3.2
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Prefer the shared self-signed pair from the gryvia-tls Secret (created by the deploy
          # script) so every pod and restart serves the same certificate; otherwise mint one.
          if [ -s /tls-src/tls.crt ] && [ -s /tls-src/tls.key ]; then
            cp /tls-src/tls.crt /tls-src/tls.key /tls/
          else
            openssl req -x509 -nodes -days 3650 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -keyout /tls/tls.key -out /tls/tls.crt -subj "/CN=gryvia-ui/O=Gryvia" -addext "subjectAltName=DNS:gryvia-ui,DNS:gryvia-ui.gryvia-system.svc,DNS:localhost,IP:127.0.0.1,IP:$HOST_IP"
          fi
          chown 101:101 /tls/tls.key /tls/tls.crt
          chmod 600 /tls/tls.key
        env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
        volumeMounts:
        - name: tls
          mountPath: /tls
        - name: tls-src
          mountPath: /tls-src
          readOnly: true
      containers:
      - name: ui
        image: gryvia/ui:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8443
          name: https
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-tmp
          mountPath: /tmp
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: tls
        emptyDir: {}
      - name: tls-src
        secret:
          secretName: gryvia-tls
          optional: true
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gryvia-ui
  namespace: gryvia-system
  labels:
    app: gryvia-ui
spec:
  type: ClusterIP
  selector:
    app: gryvia-ui
  ports:
  - port: 443
    targetPort: https
    protocol: TCP
    name: https
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gryvia-ui
  namespace: gryvia-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gryvia-ui
rules:
- apiGroups: ["gryvia.io"]
  resources: ["gryviaaijobs", "gryviaquotas", "gryviagpunodes", "gryviastorages", "gryvianetworks"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes", "pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gryvia-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gryvia-ui
subjects:
- kind: ServiceAccount
  name: gryvia-ui
  namespace: gryvia-system
---
# Envoy Gateway (Gateway API) front door; replaces the former nginx Ingress. Install the controller and the
# `eg` GatewayClass first (see docs: Envoy Gateway). The dashboard serves HTTPS on 443, so Envoy re-encrypts
# and the BackendTLSPolicy pins the CA from the ConfigMap `gryvia-ui-ca`, created once from the UI certificate:
#   kubectl -n gryvia-system get secret gryvia-tls -o jsonpath='{.data.tls\.crt}' | base64 -d |
#     kubectl -n gryvia-system create configmap gryvia-ui-ca --from-file=ca.crt=/dev/stdin
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gryvia
  namespace: gryvia-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: gryvia.example.com
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    port: 7443
    hostname: gryvia.example.com
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: gryvia-ui-tls
    allowedRoutes:
      namespaces:
        from: Same
  # Optional services (services/mlflow/deploy.yaml, examples/integrations/vscode-server.yaml).
  - name: mlflow
    protocol: HTTP
    port: 80
    hostname: mlflow.gryvia.local
    allowedRoutes:
      namespaces:
        from: Same
  - name: vscode
    protocol: HTTP
    port: 80
    hostname: vscode.gryvia.local
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gryvia-ui-redirect
  namespace: gryvia-system
spec:
  parentRefs:
  - name: gryvia
    sectionName: http
  hostnames:
  - gryvia.example.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gryvia-ui
  namespace: gryvia-system
spec:
  parentRefs:
  - name: gryvia
    sectionName: https
  hostnames:
  - gryvia.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: gryvia-ui
      port: 443
    timeouts:
      request: "0s"
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: gryvia-ui
  namespace: gryvia-system
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: gryvia-ui
  validation:
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: gryvia-ui-ca
    hostname: gryvia-ui.gryvia-system.svc
