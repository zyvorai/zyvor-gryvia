---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gryviatenants.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: GryviaTenant
    listKind: GryviaTenantList
    plural: gryviatenants
    singular: gryviatenant
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GryviaTenant is the Schema for the gryviatenants API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GryviaTenantSpec defines the desired state of GryviaTenant
            properties:
              allowedSkus:
                description: AllowedSkus lists the GryviaGpuSku names this tenant
                  may use; empty means all enabled SKUs
                items:
                  type: string
                type: array
              billing:
                description: Billing defines billing configuration
                properties:
                  billingContact:
                    description: BillingContact email
                    type: string
                  costCenter:
                    description: CostCenter identifier
                    type: string
                  paymentMethod:
                    description: PaymentMethod (credit, invoice, prepaid)
                    type: string
                  purchaseOrder:
                    description: PurchaseOrder number
                    type: string
                type: object
              description:
                description: Description of the tenant
                type: string
              displayName:
                description: DisplayName is the human-readable name
                type: string
              governance:
                description: Governance defines compliance and governance
                properties:
                  auditRetention:
                    description: AuditRetention defines how long to retain audit logs
                    type: string
                  complianceRequirements:
                    description: ComplianceRequirements (HIPAA, SOC2, GDPR, FedRAMP)
                    items:
                      type: string
                    type: array
                  dataClassification:
                    description: DataClassification level (public, internal, confidential,
                      restricted)
                    type: string
                type: object
              jobDefaults:
                description: JobDefaults defines default job settings
                properties:
                  checkpointing:
                    description: Checkpointing enables checkpointing by default
                    type: boolean
                  image:
                    description: Image is the default container image
                    type: string
                  priorityClass:
                    description: PriorityClass is the default priority class
                    type: string
                  retryPolicy:
                    description: RetryPolicy is the default retry policy
                    type: string
                type: object
              members:
                description: Members defines tenant members
                items:
                  description: TenantMember defines a tenant member
                  properties:
                    joinedAt:
                      description: JoinedAt is when the member joined
                      format: date-time
                      type: string
                    role:
                      description: Role of the member (admin, member, viewer)
                      type: string
                    username:
                      description: Username of the member
                      type: string
                  required:
                  - username
                  type: object
                type: array
              networkPolicy:
                description: NetworkPolicy defines network isolation
                properties:
                  allowedTenants:
                    description: AllowedTenants lists tenants allowed to communicate
                      with
                    items:
                      type: string
                    type: array
                  isolated:
                    description: Isolated isolates this tenant from others
                    type: boolean
                type: object
              notifications:
                description: Notifications defines notification settings
                properties:
                  email:
                    description: Email notification recipients
                    items:
                      type: string
                    type: array
                  slack:
                    description: Slack notification config
                    properties:
                      channel:
                        description: Channel is the Slack channel
                        type: string
                      webhook:
                        description: Webhook is the Slack webhook URL
                        type: string
                    type: object
                type: object
              oidcGroupRole:
                description: 'OIDCGroupRole is the tenant role given to oidcGroups:
                  viewer, member or admin'
                enum:
                - viewer
                - member
                - admin
                type: string
              oidcGroups:
                description: |-
                  OIDCGroups lists identity-provider groups that get Kubernetes access to the tenant
                  namespace with the role oidcGroupRole (default member). Requires the API server to
                  accept the group claim (--oidc-groups-claim); the gateway resolves tenants separately.
                items:
                  type: string
                type: array
              parentTenant:
                description: ParentTenant for hierarchical organization
                type: string
              priorities:
                description: Priorities defines priority settings
                properties:
                  allowHighPriority:
                    description: AllowHighPriority allows high priority jobs
                    type: boolean
                  default:
                    description: Default priority for this tenant
                    type: string
                  preemptionAllowed:
                    description: PreemptionAllowed allows preemption of this tenant's
                      jobs
                    type: boolean
                type: object
              quotas:
                description: Quotas defines resource quotas
                properties:
                  borrowingLimit:
                    description: |-
                      BorrowingLimit caps how many GPUs the tenant may borrow from the cohort above its quota.
                      Unset means no cap.
                    minimum: 0
                    type: integer
                  cohort:
                    description: |-
                      Cohort places the tenant's queue in a named cohort instead of the default "gryvia", so
                      borrowing happens only among tenants sharing the name (for example one cohort per org).
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  concurrentGPUs:
                    description: ConcurrentGPUs is the max concurrent GPUs
                    type: integer
                  fairShareWeight:
                    description: |-
                      FairShareWeight is the tenant's weight in Kueue fair sharing (default 1). A tenant with
                      weight 3 is entitled to three times the contended capacity of a tenant with weight 1.
                      Applied only when the quota operator runs with --kueue-fair-sharing.
                    minimum: 1
                    type: integer
                  lendingLimit:
                    description: |-
                      LendingLimit caps how many of the tenant's own GPUs other tenants may borrow. Unset means
                      all idle quota is lendable.
                    minimum: 0
                    type: integer
                  concurrentJobs:
                    description: ConcurrentJobs is the max concurrent jobs
                    type: integer
                  costUSD:
                    description: CostUSD defines cost quota
                    properties:
                      burst:
                        description: Burst capacity above quota
                        type: number
                      monthly:
                        description: Monthly cost limit in USD
                        type: number
                    type: object
                  gpuHours:
                    description: GPUHours defines GPU hours quota
                    properties:
                      burst:
                        description: Burst capacity above quota
                        type: number
                      monthly:
                        description: Monthly GPU hours limit
                        type: number
                    type: object
                  perGPUType:
                    additionalProperties:
                      description: TenantGPUTypeQuota defines per-GPU-type quota
                      properties:
                        count:
                          description: Count is the max concurrent GPUs of this type
                          type: integer
                        hours:
                          description: Hours is the max hours per month for this type
                          type: number
                      type: object
                    description: PerGPUType is per-GPU-type quotas
                    type: object
                type: object
              storageQuotas:
                description: StorageQuotas defines storage limits
                properties:
                  datasets:
                    description: Datasets storage quota
                    type: string
                  home:
                    description: Home directory quota
                    type: string
                  models:
                    description: Models storage quota
                    type: string
                  scratch:
                    description: Scratch storage quota
                    type: string
                type: object
            type: object
          status:
            description: GryviaTenantStatus defines the observed state of GryviaTenant
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentUsage:
                description: CurrentUsage tracks current resource usage
                properties:
                  costUSD:
                    description: CostUSD spent this month
                    type: number
                  gpuHours:
                    description: GPUHours consumed this month
                    type: number
                  runningJobs:
                    description: RunningJobs is the number of running jobs
                    type: integer
                  usedGPUs:
                    description: UsedGPUs is the number of GPUs in use
                    type: integer
                type: object
              health:
                description: Health is the tenant health status (healthy, warning,
                  quota-exceeded)
                type: string
              memberCount:
                description: MemberCount is the number of members
                type: integer
              namespacesManaged:
                description: NamespacesManaged lists managed namespaces
                items:
                  type: string
                type: array
              quotaUtilization:
                description: QuotaUtilization tracks utilization percentages
                properties:
                  costPercent:
                    description: CostPercent is cost utilization
                    type: number
                  gpuHoursPercent:
                    description: GPUHoursPercent is GPU hours utilization
                    type: number
                  jobsPercent:
                    description: JobsPercent is jobs utilization
                    type: number
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
