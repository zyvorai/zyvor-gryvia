# Apply after regenerating CRDs from the Go API markers, or merge these properties
# into GryviaAIJob.spec. They are optional because annotation compatibility remains.
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/gpuShare
  value:
    type: string
    description: "Fractional GPU share per pod (for example 0.25, 0.5, 1.0). Runtime isolation is selected by gpuIsolation."
    pattern: '^[0-9]+([.][0-9]+)?$'
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/gpuIsolation
  value:
    type: string
    description: "GPU execution isolation backend."
    enum: [auto, full, mig, mps, dra]
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/minAvailable
  value:
    type: integer
    format: int32
    minimum: 1
    description: "Native gang admission lower bound; distributed.elastic.minNodes still takes precedence for elastic training."
